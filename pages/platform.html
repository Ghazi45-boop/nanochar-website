    🔎 Preview mode — sample data. Real accounts coming in Phase 2.

  <div class="demo-box">
    <h3>Quick Soil Assessment</h3>
    <label>Soil pH</label>
    <select id="soilPh">
      <option value="acidic">Acidic (below 6.0)</option>
      <option value="neutral">Neutral (6.0–7.0)</option>
      <option value="alkaline">Alkaline (above 7.0)</option>
    </select>
 
    <label>Crop Type</label>
    <select id="cropType">
      <option value="maize">Maize</option>
      <option value="cassava">Cassava</option>
      <option value="vegetables">Vegetables</option>
    </select>
 
    <button class="btn btn-primary" onclick="getRecommendation()">Get Recommendation</button>
 
    <div id="resultBox" class="result-box" style="display:none;"></div>
  </div>
