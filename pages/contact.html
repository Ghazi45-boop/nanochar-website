<!DOCTYPE html>
<html lang="en">
<head>

    <title>Contact NanoChar Africa</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    
   <header class="site-header">
    <div class="logo">NanoChar <span>Africa</span></div>
    <nav>
    <a href="../index.html">Home</a>
    <a href="about.html">About</a>
    <a href="products.html">Products</a>
    <a href="platform.html">Digital Platform</a>
    <a href="contact.html">Contact</a>
  </nav>
   </header>

<section class="section">
  <h2 class="section-title">Get In Touch</h2>
  <form class="contact-form" action="mailto:hello@nanocharafrica.com" method="post" enctype="text/plain">
    <label for="name">Name</label>
    <input id="name" type="text" name="name" title="Name" placeholder="Your Name" required>
    <label for="email">Email</label>
    <input id="email" type="email" name="email" title="Email" placeholder="you@example.com" required>
    <label for="message">Message</label>
    <textarea id="message" name="message" title="Message" rows="5" placeholder="Your message" required></textarea>
    <button type="submit" class="btn btn-primary">Send Message</button>
  </form>
</section>


<footer class="site-footer">
  <p>&copy; 2026 NanoChar Africa. Restoring soil, empowering farmers.</p>
</footer>


</body>
</html>
